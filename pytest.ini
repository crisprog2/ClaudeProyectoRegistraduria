[pytest]
testpaths = tests
# Permite importar los módulos de tests/support como "support.*".
pythonpath = tests
python_files = test_*.py
bdd_features_base_dir = tests/bdd/features
addopts = -ra --strict-markers
markers =
    api: pruebas black-box de la API REST
    bdd: escenarios Gherkin con pytest-bdd
    e2e: pruebas de interfaz con Playwright
    smoke: subconjunto crítico y rápido
    regression: suite de regresión completa
